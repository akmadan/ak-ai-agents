apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: medical-assistant
  namespace: kagent
spec:
  description: Answers general health questions with input and output guardrails.
  type: BYO
  byo:
    deployment:
      image: medical-assistant-adk:kagent
      imagePullPolicy: IfNotPresent
      env:
        - name: GOOGLE_API_KEY
          valueFrom:
            secretKeyRef:
              name: kagent-gemini
              key: GOOGLE_API_KEY
