apiVersion: v1
kind: Secret
metadata:
  name: travel-planner-secrets
  namespace: akshit-madan
type: Opaque
stringData:
  # Paste the Gemini key. Do not commit a real value.
  GOOGLE_API_KEY: REPLACE_ME
  # Full header value, including the Bearer prefix. Example: Bearer tvly-...
  TAVILY_AUTHORIZATION: Bearer REPLACE_ME
