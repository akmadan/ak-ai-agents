apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: tavily
  namespace: akshit-madan
spec:
  description: Tavily web search for current travel facts and published price ranges.
  protocol: STREAMABLE_HTTP
  url: https://mcp.tavily.com/mcp/
  timeout: 60s
  headersFrom:
    - name: Authorization
      valueFrom:
        type: Secret
        name: travel-planner-secrets
        key: TAVILY_AUTHORIZATION
    - name: DEFAULT_PARAMETERS
      value: '{"max_results":5,"search_depth":"basic","include_images":false}'
