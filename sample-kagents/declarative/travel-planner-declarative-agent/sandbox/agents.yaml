apiVersion: kagent.dev/v1alpha2
kind: SandboxAgent
metadata:
  name: travel-planner
  namespace: akshit-madan
spec:
  description: Plans a trip by delegating to destination, itinerary, and budget specialists.
  type: Declarative
  sandbox:
    network:
      allowedDomains:
        - generativelanguage.googleapis.com
        - mcp.tavily.com
        - place-catalog.akshit-madan.svc.cluster.local
  declarative:
    runtime: go
    modelConfig: travel-planner-gemini
    stream: true
    systemMessageFrom:
      type: ConfigMap
      name: travel-planner-prompts
      key: supervisor
    tools:
      - type: Agent
        isolateSessions: true
        agent:
          apiGroup: kagent.dev
          kind: SandboxAgent
          name: destination-research
      - type: Agent
        isolateSessions: true
        agent:
          apiGroup: kagent.dev
          kind: SandboxAgent
          name: itinerary-planning
      - type: Agent
        isolateSessions: true
        agent:
          apiGroup: kagent.dev
          kind: SandboxAgent
          name: budget-feasibility
