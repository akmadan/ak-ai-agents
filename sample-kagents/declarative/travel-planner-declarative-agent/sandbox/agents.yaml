apiVersion: kagent.dev/v1alpha2
kind: SandboxAgent
metadata:
  name: destination-research
  namespace: akshit-madan
spec:
  description: Recommends destinations from the place catalog and returns place_id values.
  type: Declarative
  sandbox:
    network:
      allowedDomains:
        - generativelanguage.googleapis.com
        - mcp.tavily.com
        - place-catalog.akshit-madan.svc.cluster.local
  declarative:
    runtime: go
    modelConfig: travel-planner-gemini
    stream: true
    systemMessageFrom:
      type: ConfigMap
      name: travel-planner-prompts
      key: destination
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: MCPServer
          name: place-catalog
          toolNames:
            - search_destinations
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: tavily
          toolNames:
            - tavily_search
---
